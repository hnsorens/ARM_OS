; One `[module_name]` section per module, each with its own `enable` flag
; and (if it imports anything) a sibling `[module_name.dependencies]`
; section wiring each interface type it needs to the module that provides
; it. A dependency entry is only required when more than one module could
; provide a type -- with a single provider registered, the bootloader
; resolves it automatically. Everything below is spelled out explicitly
; anyway, both as documentation and as the wiring a future node-graph
; editor would produce (one node per module, one edge per dependency line).
;
; A dependency line's key is the lowercased ABI struct name from
; shared/abi_types.zig (Mmu -> mmu, InterruptManager -> interruptmanager,
; ...); its value is the provider's `[module_name]`.

[dummy]
enable = true

[configtest]
enable = true
[configtest.config]
retry_count = 42
enabled_feature = true
label = hello

[dummy2]
enable = true
[dummy2.dependencies]
dummy = dummy

