; Describes this module's interface for tooling (e.g. the node-graph
; configurator app) -- not read by the bootloader. The wiring that
; actually matters at boot time lives in kernel.ini's
; [module_name.dependencies]/[module_name.config] sections; this file is a
; per-module mirror of the abi.exportInterface/importInterface/
; declareConfig* calls in main.zig, kept for humans and external tools to
; read without parsing Zig comptime.
;
; This module exists purely to exercise the config pipeline end to end
; (see main.zig's kernelTest) and to serve as a fixture for the
; configurator app.

[module]
name = configtest

[provides]

[requires]

; Each key in `[config]`'s `keys` list gets its own `[config.<key>]`
; section describing how the configurator app should render/validate it.
; `type` is one of: int, bool, str (needs max_len), enum (needs options).
[config]
keys = retry_count, enabled_feature, label

[config.retry_count]
type = int
default = 3
label = Retry Count
description = Number of retry attempts before giving up
min = 0
max = 100

[config.enabled_feature]
type = bool
default = false
label = Enable Feature
description = Toggles the experimental feature path

[config.label]
type = str
default = default
max_len = 16
label = Label
description = Free-form identifying label
