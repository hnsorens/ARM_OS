; Describes this module's interface for tooling (e.g. the node-graph
; configurator app) -- not read by the bootloader. The wiring that
; actually matters at boot time lives in kernel.ini's
; [module_name.dependencies]/[module_name.config] sections; this file is a
; per-module mirror of the abi.exportInterface/importInterface/
; declareConfig* calls in main.zig, kept for humans and external tools to
; read without parsing Zig comptime.

[module]
name = hnsorens.fs.vfs

[provides]
; instance_name = InterfaceType (see shared/abi_types.zig)
vfs = Vfs

[requires]
; kernel.ini [Dependencies] type-suffix = InterfaceType (see shared/abi_types.zig)
virtiobus = VirtioBus
blkdevice = BlkDevice
gpt = Gpt
ext2 = Ext2
serial = Serial

[config]
keys = virtio_device_id, root_partition_index

[config.virtio_device_id]
type = int
default = 2
label = VirtIO Device ID
description = VirtIO device-type ID to look for on the bus (2 = block device)

[config.root_partition_index]
type = int
default = -1
label = Root Partition Index
description = GPT partition index to mount as root (-1 = auto-select the first "Linux filesystem" (8300) partition)
