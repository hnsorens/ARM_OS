; Describes this module's interface for tooling (e.g. a future node-graph
; editor) -- not read by the bootloader. The wiring that actually matters
; at boot time lives in kernel.ini's [Dependencies] section; this file is
; a per-module mirror of the abi.exportInterface/abi.importInterface calls
; in main.zig, kept for humans and external tools to read without parsing
; Zig comptime.

[module]
name = hnsorens.io.gic_v3

[provides]
; instance_name = InterfaceType (see shared/abi_types.zig)
gic_v3 = InterruptManager

[requires]
; kernel.ini [Dependencies] type-suffix = InterfaceType (see shared/abi_types.zig)
serial = Serial
