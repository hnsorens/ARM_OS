; Describes this module's interface for tooling (e.g. the node-graph
; configurator app) -- not read by the bootloader. The wiring that
; actually matters at boot time lives in kernel.ini's
; [module_name.dependencies]/[module_name.config] sections; this file is a
; per-module mirror of the abi.exportInterface/importInterface/
; declareConfig* calls in main.zig, kept for humans and external tools to
; read without parsing Zig comptime.

[module]
name = hnsorens.io.virtio_bus

[provides]
; instance_name = InterfaceType (see shared/abi_types.zig)
virtio_bus = VirtioBus

[requires]
; kernel.ini [Dependencies] type-suffix = InterfaceType (see shared/abi_types.zig)
pmm = Pmm
serial = Serial

[config]
keys = mmio_scan_base, mmio_scan_end, mmio_scan_stride

[config.mmio_scan_base]
type = int
default = 167772160
label = MMIO Scan Base
description = Physical address where VirtIO-MMIO device scanning starts (QEMU virt default: 0x0A000000)

[config.mmio_scan_end]
type = int
default = 167788544
label = MMIO Scan End
description = Physical address (exclusive) where VirtIO-MMIO device scanning stops (QEMU virt default: 0x0A004000)

[config.mmio_scan_stride]
type = int
default = 512
label = MMIO Scan Stride
description = Byte distance between successive VirtIO-MMIO device slots (QEMU virt default: 0x200)
