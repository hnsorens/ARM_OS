; Describes this module's interface for tooling -- not read by the
; bootloader. The wiring that matters at boot time lives in kernel.ini.

[module]
name = hnsorens.proc.elf_loader

[provides]
; instance_name = InterfaceType (see shared/abi_types.zig)
loader = Elf

[requires]
; kernel.ini [Dependencies] type-suffix = InterfaceType (see shared/abi_types.zig)
vfs = Vfs
mmu = Mmu
pmm = Pmm
process = Process
scheduler = Scheduler
fd = Fd
syscalls = Syscalls
serial = Serial
